<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard seguimiento MEL | Swisscontact · EAN Impacta</title>
<style>
:root{
  --red:#E42739; --blue:#004D8B; --blue2:#2E70A2; --ink:#3A4752; --muted:#777; --line:#E6E9EC;
  --bg:#F6F7F8; --white:#fff; --green:#2E7D32; --green-bg:#EEF7EF; --amber:#A65A00; --amber-bg:#FFF4E5;
}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
button,input,select{font:inherit}.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.topin{max-width:1500px;margin:auto;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brands{display:flex;align-items:center;gap:20px}.swiss{font-size:20px;color:var(--blue);font-weight:700}.cc{color:var(--red);font-weight:800}.ean{font-weight:800;color:#222;border-left:1px solid var(--line);padding-left:18px}.demo{font-size:12px;background:#FFF0F2;color:#B71C2B;padding:7px 10px;border-radius:999px;font-weight:700}
.wrap{max-width:1500px;margin:auto;padding:22px}.hero{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:14px}.hero h1{font-family:"Century Gothic","Segoe UI",sans-serif;color:var(--blue);margin:0 0 6px;font-size:25px}.hero p{margin:0;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1fr 220px 220px auto;gap:10px;margin-bottom:12px}.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}.box label{display:block;font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}.box input,.box select{width:100%;border:0;outline:0;background:transparent;color:var(--ink)}
.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:700;cursor:pointer}.btn.red{background:var(--red);color:#fff}.btn.out{background:#fff;color:var(--blue);border:1px solid #C9D9E5}.btn.link{background:transparent;color:var(--blue);padding:3px 0}.btn.small{padding:6px 8px;font-size:11px}
.tabs{display:flex;gap:6px;overflow:auto;padding:2px 0 12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;color:#5E6970;font-weight:700;cursor:pointer}.tab.active{background:var(--red);border-color:var(--red);color:#fff}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.headrow h2{font-family:"Century Gothic","Segoe UI",sans-serif;color:var(--blue);font-size:19px;margin:0 0 4px}.note{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px}.kpi span{display:block;font-size:11px;color:var(--muted);font-weight:700}.kpi b{display:block;font-size:24px;margin-top:4px;color:var(--blue)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.tbl{border-collapse:collapse;width:100%;min-width:1000px}.tbl th{background:#F3F5F6;padding:9px 10px;text-align:left;font-size:10px;text-transform:uppercase;color:#647078;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.tbl td{padding:9px 10px;border-bottom:1px solid #EEF0F2;font-size:12px;vertical-align:top}.tbl tr:last-child td{border-bottom:0}.company{font-weight:700;min-width:150px}.sub{font-size:10px;color:var(--muted);margin-top:2px}
.doccell{min-width:190px}.docstate{display:flex;align-items:center;gap:6px;font-weight:700}.check{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--green-bg);color:var(--green);font-weight:900}.pending{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#F1F2F3;color:#999}.filename{font-size:10px;color:var(--muted);max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.pct{font-weight:800;color:var(--blue)}.bar{width:100px;height:7px;background:#E8EDF0;border-radius:99px;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:var(--blue2)}
.complete{background:#F5FBF6}.stage-ok{color:var(--green);font-weight:800}.stage-no{color:#999}.empty{padding:28px;text-align:center;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.badge.green{background:var(--green-bg);color:var(--green)}.badge.amber{background:var(--amber-bg);color:var(--amber)}
.hidden{display:none!important}.toast{position:fixed;right:20px;bottom:20px;background:#24313B;color:#fff;padding:11px 14px;border-radius:9px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50}.toast.show{opacity:1;transform:none}.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;padding:16px;width:min(520px,100%)}.modalbox h3{margin:0 0 8px;color:var(--blue)}
.bitcell{min-width:220px}.bitcount{font-weight:800;color:var(--blue)}.bitlist{margin-top:7px;border-top:1px solid var(--line);padding-top:6px}.bititem{padding:6px 0;border-bottom:1px dashed #E7EAED}.bititem:last-child{border-bottom:0}.bitmeta{font-size:10px;color:var(--muted);margin:2px 0 4px}.bittext{font-size:11px;color:var(--ink);margin:2px 0}.modalgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modalgrid .full{grid-column:1/-1}.modalbox label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:4px}.modalbox input,.modalbox textarea,.modalbox select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px}.modalbox textarea{min-height:80px;resize:vertical}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.caret{font-size:11px}.bitbadge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 7px;background:#EEF4F8;color:var(--blue);font-size:10px;font-weight:800}
.bitsbox{width:min(920px,100%);max-height:85vh;display:flex;flex-direction:column}.bitshead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}.bitshead h3{margin:0;color:var(--blue)}.bitsstage{font-size:12px;color:var(--muted);margin-top:2px}.bitscontent{overflow:auto;padding-right:4px;margin-top:6px}.modalbit{border:1px solid var(--line);border-radius:10px;padding:12px 12px 10px;margin-bottom:10px;background:#FBFCFD}.modalbit:last-child{margin-bottom:0}.modalbithead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}.modalbittitle{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.modalbit .bittext{font-size:12px}.modalbit .actions{margin-top:6px}.modalempty{padding:20px;border:1px dashed #D7DEE4;border-radius:10px;text-align:center;color:var(--muted);background:#FCFDFE}

/* Microanimaciones inspiradas en la experiencia de Visión Circular */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{0%{opacity:0;transform:scale(.72)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
@keyframes progressGrow{from{width:0}}
@keyframes softPulse{0%,100%{box-shadow:0 0 0 0 rgba(228,39,57,0)}50%{box-shadow:0 0 0 5px rgba(228,39,57,.08)}}
.hero{animation:fadeUp .35s ease both}
.toolbar{animation:fadeUp .4s .04s ease both}
.tabs{animation:fadeUp .42s .08s ease both}
.panel{animation:fadeUp .32s ease both}
.kpi{animation:fadeUp .34s ease both;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.kpi:nth-child(2){animation-delay:.035s}.kpi:nth-child(3){animation-delay:.07s}.kpi:nth-child(4){animation-delay:.105s}
.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(27,54,73,.08);border-color:#D2DDE4}
.btn{transition:transform .14s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease,opacity .18s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.red:hover{box-shadow:0 5px 14px rgba(228,39,57,.20)}
.btn.out:hover{border-color:var(--blue2);background:#F7FBFE}
.tab{transition:transform .16s ease,background .2s ease,color .2s ease,border-color .2s ease,box-shadow .2s ease}
.tab:hover{transform:translateY(-1px);border-color:#C9D9E5;box-shadow:0 4px 10px rgba(27,54,73,.06)}
.tab.active{animation:softPulse .45s ease}
.tbl tbody tr{transition:background .16s ease,transform .16s ease}
.tbl tbody tr:hover{background:#FAFCFD}
.check{animation:popIn .28s ease both}
.pending{transition:transform .16s ease}.doccell:hover .pending{transform:scale(1.06)}
.bar>i{animation:progressGrow .5s ease both;transition:width .35s ease}
.badge,.bitbadge{transition:transform .16s ease}.badge:hover,.bitbadge:hover{transform:translateY(-1px)}
.bitlist:not(.hidden){animation:slideDown .22s ease both}
.bititem{animation:fadeIn .22s ease both}
.modal.show{animation:fadeIn .16s ease both}
.modal.show .modalbox{animation:modalIn .22s ease both}
.toast{transition:opacity .22s ease,transform .22s ease,box-shadow .22s ease}
.toast.show{box-shadow:0 10px 28px rgba(0,0,0,.18)}
.box{transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease}
.box:focus-within{border-color:#AFC9DB;box-shadow:0 0 0 3px rgba(46,112,162,.08);transform:translateY(-1px)}
.complete td:first-child{position:relative}
.complete td:first-child:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green);animation:fadeIn .35s ease}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

@media(max-width:950px){.toolbar{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.ean{display:none}}
@media(max-width:600px){.wrap,.topin{padding-left:12px;padding-right:12px}.toolbar{grid-template-columns:1fr}.cc{display:none}.kpis{grid-template-columns:1fr 1fr}.headrow{flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div class="brands"><div class="swiss">swisscontact</div><div class="cc">Colombia + Competitiva</div><div class="ean">EAN · IMPACTA</div></div><div class="demo">VERSIÓN INICIAL · seguimiento en cero</div></div></header>

  <section class="toolbar">
    <div class="box"><label>Empresa</label><select id="q"><option value="">Todas las PyMEs</option><option value="ROLLOS COLOMBIA SAS">IR-001 · ROLLOS COLOMBIA SAS</option><option value="HUEVOS SAN NICOLÁS SAS">IR-002 · HUEVOS SAN NICOLÁS SAS</option><option value="SELVA NEVADA SAS">IR-003 · SELVA NEVADA SAS</option><option value="SERV. TECNOLOGÍA, CONSTRUCCIÓN Y AMBIENTAL SAS">IR-004 · SERV. TECNOLOGÍA, CONSTRUCCIÓN Y AMBIENTAL SAS</option><option value="PANAVAYU SAS BIC">IR-005 · PANAVAYU SAS BIC</option><option value="KOKIS SAS">IR-006 · KOKIS SAS</option><option value="PRODUCTOS NATURALES ETAMUYSA">IR-007 · PRODUCTOS NATURALES ETAMUYSA</option><option value="SUMASACHA SAS BIC">IR-008 · SUMASACHA SAS BIC</option><option value="BNS COLOMBIA SAS BIC">IR-009 · BNS COLOMBIA SAS BIC</option><option value="PLÁSTICOS AMBIENTALES SAS">IR-010 · PLÁSTICOS AMBIENTALES SAS</option><option value="RECUPERADORES DE MATERIALES INDUSTRIALES SAS ESP">IR-011 · RECUPERADORES DE MATERIALES INDUSTRIALES SAS ESP</option><option value="COSTAL CAMPESINO DE COLOMBIA SAS">IR-012 · COSTAL CAMPESINO DE COLOMBIA SAS</option><option value="BIOINGRED TECH SAS">IR-013 · BIOINGRED TECH SAS</option><option value="PAPELES EL TUNAL SAS">IR-014 · PAPELES EL TUNAL SAS</option><option value="AYCI SAS BIC">IR-015 · AYCI SAS BIC</option><option value="CARYO SAS">IR-016 · CARYO SAS</option><option value="NATIVUS SAS">IR-017 · NATIVUS SAS</option><option value="NUTRE INGREDIENTES &amp; ALIMENTOS SAS">IR-018 · NUTRE INGREDIENTES &amp; ALIMENTOS SAS</option><option value="NATURESSE">IR-019 · NATURESSE</option><option value="HERNANDEZ E HIJOS 2023 SAS">IR-020 · HERNANDEZ E HIJOS 2023 SAS</option><option value="AGRONACER SAS">IR-021 · AGRONACER SAS</option><option value="TU AGRO ENLACE INDUSTRIAS SAS">IR-022 · TU AGRO ENLACE INDUSTRIAS SAS</option><option value="BARRPLASTIC SAS">IR-023 · BARRPLASTIC SAS</option><option value="BUSINEX SAS">IR-024 · BUSINEX SAS</option><option value="ECOPLANET SOLUCIONES INTEGRALES SAS">IR-025 · ECOPLANET SOLUCIONES INTEGRALES SAS</option><option value="INVERSIONES HERMANOS DE SILVESTRI SAS">IR-026 · INVERSIONES HERMANOS DE SILVESTRI SAS</option><option value="MESA BAJA AGROINDUSTRIA SAS">IR-027 · MESA BAJA AGROINDUSTRIA SAS</option><option value="MY ECOHOME SAS">IR-028 · MY ECOHOME SAS</option></select></div>
    <div class="box"><label>Cadena</label><select id="chain"><option value="">Todas</option><option>Ingredientes Naturales</option><option>Agricultura Sostenible</option><option>Economía Circular</option></select></div>
    <div class="box"><label>Estado documental</label><select id="state"><option value="">Todos</option><option value="complete">Completos</option><option value="pending">Con pendientes</option></select></div>
    <button class="btn out" onclick="clearDemo()">Limpiar datos</button>
  </section>
  <nav class="tabs" id="tabs"></nav>
  <section id="content"></section>
</main>
<div id="toast" class="toast"></div>
<div id="modal" class="modal"><div class="modalbox"><h3 id="modalTitle">Documento</h3><div id="modalBody" class="note"></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn out" onclick="closeModal()">Cerrar</button></div></div></div>
<script>
const STAGES=[
 {id:'overview',name:'Resumen'},
 {id:'s0',name:'Etapa 0 · Diagnóstico',docs:['Diagnóstico IR línea base','Mapa de brechas','Plan de acompañamiento','Estructura inicial Data Room']},
 {id:'s1',name:'Etapa 1 · Panorama de inversión',docs:['Instrumento de financiamiento preliminar','Ruta preliminar de financiación']},
 {id:'s2',name:'Etapa 2 · Modelo de negocio',docs:['Plan de crecimiento','Propuesta de valor refinada','Modelo / teoría de cambio','Matriz de indicadores de impacto']},
 {id:'s3',name:'Etapa 3 · Gobernanza',docs:['Plan de mejora en gobernanza','Matriz de riesgos internos','Diagnóstico legal y tributario','Ruta GEDSI / criterios 2X']},
 {id:'s4',name:'Etapa 4 · Fundamentos financieros',docs:['Modelo financiero 3–5 años','KPIs y capital de trabajo','Matriz de riesgos financieros']},
 {id:'s5',name:'Etapa 5 · Estrategia de financiación',docs:['Estructura de capital y uso de fondos','Pitch deck preliminar','Investment Brief','Data Room ≥70%']},
 {id:'s6',name:'Etapa 6 · Cierre IR',docs:['Diagnóstico IR de cierre','Pitch deck final','Investment Brief final','Modelo financiero ajustado','Data Room 100%','Checklist Due Diligence']},
 {id:'a2',name:'Actividad 2 · Vinculación',docs:['Ficha de matchmaking','Registro de interacción con financiador','Solicitudes / Q&A','Evidencia Due Diligence','Plan de próximos pasos']},
 {id:'mel',name:'MEL · Cohorte',docs:['Reporte mensual MEL','Acta de coordinación','Matriz de riesgos actualizada','Reporte GEDSI / sostenibilidad']}
];
const chains=['Ingredientes Naturales','Agricultura Sostenible','Economía Circular'];
const companies=[{"id":"IR-001","name":"ROLLOS COLOMBIA SAS","chain":"Economía Circular","contact":"Jhon Erik Rodas"},{"id":"IR-002","name":"HUEVOS SAN NICOLÁS SAS","chain":"Economía Circular","contact":"Nicolás Aguilar Sarria"},{"id":"IR-003","name":"SELVA NEVADA SAS","chain":"Ingredientes Naturales","contact":"Catalina Álvarez"},{"id":"IR-004","name":"SERV. TECNOLOGÍA, CONSTRUCCIÓN Y AMBIENTAL SAS","chain":"Economía Circular","contact":"Jhon Esneider Guerrero Carvajal"},{"id":"IR-005","name":"PANAVAYU SAS BIC","chain":"Ingredientes Naturales","contact":"Fabián Leonardo Huertas Ayala"},{"id":"IR-006","name":"KOKIS SAS","chain":"Ingredientes Naturales","contact":"Ingridt Katherin Guerrero Pompey"},{"id":"IR-007","name":"PRODUCTOS NATURALES ETAMUYSA","chain":"Agricultura Sostenible","contact":"María Angélica Forero"},{"id":"IR-008","name":"SUMASACHA SAS BIC","chain":"Ingredientes Naturales","contact":"Mireya Andrea Porras Cárdenas"},{"id":"IR-009","name":"BNS COLOMBIA SAS BIC","chain":"Agricultura Sostenible","contact":"Santiago Posada Posada"},{"id":"IR-010","name":"PLÁSTICOS AMBIENTALES SAS","chain":"Economía Circular","contact":"Santiago Casas Zapata"},{"id":"IR-011","name":"RECUPERADORES DE MATERIALES INDUSTRIALES SAS ESP","chain":"Economía Circular","contact":"Diego Samuel Martínez"},{"id":"IR-012","name":"COSTAL CAMPESINO DE COLOMBIA SAS","chain":"Economía Circular","contact":"Federico Castro Diez"},{"id":"IR-013","name":"BIOINGRED TECH SAS","chain":"Ingredientes Naturales","contact":"Luis Carlos Carrillo"},{"id":"IR-014","name":"PAPELES EL TUNAL SAS","chain":"Economía Circular","contact":"Mayra Alejandra Beltrán Zorro"},{"id":"IR-015","name":"AYCI SAS BIC","chain":"Agricultura Sostenible","contact":"Yuly Galindo"},{"id":"IR-016","name":"CARYO SAS","chain":"Ingredientes Naturales","contact":"Camilo Bueno"},{"id":"IR-017","name":"NATIVUS SAS","chain":"Ingredientes Naturales","contact":"Lilly Alcira Rocha Chacon"},{"id":"IR-018","name":"NUTRE INGREDIENTES & ALIMENTOS SAS","chain":"Economía Circular","contact":"Ernesto Altman"},{"id":"IR-019","name":"NATURESSE","chain":"Ingredientes Naturales","contact":"Natalia Osorio"},{"id":"IR-020","name":"HERNANDEZ E HIJOS 2023 SAS","chain":"Economía Circular","contact":"Raúl Felipe Hernández Rojas"},{"id":"IR-021","name":"AGRONACER SAS","chain":"Economía Circular","contact":"Natalia Ospina Herrán"},{"id":"IR-022","name":"TU AGRO ENLACE INDUSTRIAS SAS","chain":"Agricultura Sostenible","contact":"NERY ALEXANDRA ATRA MÁRQUEZ"},{"id":"IR-023","name":"BARRPLASTIC SAS","chain":"Economía Circular","contact":"JULIO MENA MARTÍNEZ"},{"id":"IR-024","name":"BUSINEX SAS","chain":"Agricultura Sostenible","contact":"EDWIN OSWALDO ROJAS BARBOSA"},{"id":"IR-025","name":"ECOPLANET SOLUCIONES INTEGRALES SAS","chain":"Economía Circular","contact":"SANDRA ÁLVAREZ"},{"id":"IR-026","name":"INVERSIONES HERMANOS DE SILVESTRI SAS","chain":"Agricultura Sostenible","contact":"IVIS PEÑA DEL CHIARO"},{"id":"IR-027","name":"MESA BAJA AGROINDUSTRIA SAS","chain":"Ingredientes Naturales","contact":"Sara Grisales Olaya"},{"id":"IR-028","name":"MY ECOHOME SAS","chain":"Ingredientes Naturales","contact":"MARITZA LÓPEZ PARRA"}];
let current='overview';

const DB_NAME='swisscontact_mel_inicial_v10', STORE='docs', BITSTORE='bitacoras'; let db;
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,2);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'key'});if(!d.objectStoreNames.contains(BITSTORE))d.createObjectStore(BITSTORE,{keyPath:'id'})};r.onsuccess=e=>{db=e.target.result;resolve(db)};r.onerror=()=>reject(r.error)})}
function putDoc(rec){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(rec);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function getAllDocs(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getDoc(key){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const r=tx.objectStore(STORE).get(key);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function delDoc(key){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function clearDB(){return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function putBit(rec){return new Promise((resolve,reject)=>{const tx=db.transaction(BITSTORE,'readwrite');tx.objectStore(BITSTORE).put(rec);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function getAllBits(){return new Promise((resolve,reject)=>{const tx=db.transaction(BITSTORE,'readonly');const r=tx.objectStore(BITSTORE).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function getBit(id){return new Promise((resolve,reject)=>{const tx=db.transaction(BITSTORE,'readonly');const r=tx.objectStore(BITSTORE).get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function delBit(id){return new Promise((resolve,reject)=>{const tx=db.transaction(BITSTORE,'readwrite');tx.objectStore(BITSTORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
function clearBits(){return new Promise((resolve,reject)=>{const tx=db.transaction(BITSTORE,'readwrite');tx.objectStore(BITSTORE).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
const key=(company,stage,doc)=>`${company}|${stage}|${doc}`;
let docsMap=new Map(), bitacoras=[];
async function refreshDocs(){const all=await getAllDocs();docsMap=new Map(all.map(x=>[x.key,x]));bitacoras=await getAllBits();}
function bitsFor(company,stage){return bitacoras.filter(b=>b.company===company&&(!stage||b.stage===stage)).sort((a,b)=>(b.session||0)-(a.session||0) || String(b.date||'').localeCompare(String(a.date||'')));}
function nextSession(company){const xs=bitacoras.filter(b=>b.company===company).map(b=>Number(b.session)||0);return (xs.length?Math.max(...xs):0)+1}
function hasDoc(c,s,d){return docsMap.has(key(c,s,d))}
function stagePct(c,s){const st=STAGES.find(x=>x.id===s);if(!st?.docs?.length)return 0;const done=st.docs.filter((_,i)=>hasDoc(c,s,i)).length;return Math.round(done/st.docs.length*100)}
function stageComplete(c,s){return stagePct(c,s)===100}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function filteredCompanies(stageId){const q=document.getElementById('q').value;const chain=document.getElementById('chain').value;const state=document.getElementById('state').value;return companies.filter(c=>{if(q&&c.name!==q)return false;if(chain&&c.chain!==chain)return false;if(state&&stageId!=='overview'){const comp=stageComplete(c.id,stageId);if(state==='complete'&&!comp)return false;if(state==='pending'&&comp)return false;}return true})}
function renderTabs(){document.getElementById('tabs').innerHTML=STAGES.map(s=>`<button class="tab ${current===s.id?'active':''}" onclick="setTab('${s.id}')">${s.name}</button>`).join('')}
function kpiBlock(stageId){const list=companies;let complete=0,totalSlots=0,loaded=0;if(stageId==='overview'){for(const c of list){const stageIds=STAGES.filter(s=>s.docs).map(s=>s.id);const vals=stageIds.map(s=>stageComplete(c.id,s));if(vals.every(Boolean))complete++;for(const s of STAGES.filter(s=>s.docs)){totalSlots+=s.docs.length;loaded+=s.docs.filter((_,i)=>hasDoc(c.id,s.id,i)).length}}}else{const st=STAGES.find(x=>x.id===stageId);for(const c of list){if(stageComplete(c.id,stageId))complete++;totalSlots+=st.docs.length;loaded+=st.docs.filter((_,i)=>hasDoc(c.id,stageId,i)).length}}
return `<div class="kpis"><div class="kpi"><span>PyMEs</span><b>25</b></div><div class="kpi"><span>Completas</span><b>${complete}</b></div><div class="kpi"><span>Con pendientes</span><b>${25-complete}</b></div><div class="kpi"><span>Documentos cargados</span><b>${loaded}/${totalSlots}</b></div></div>`}
function overview(){const stageIds=STAGES.filter(s=>s.docs).map(s=>s.id);const list=filteredCompanies('overview');return `${kpiBlock('overview')}<div class="panel"><div class="headrow"><div><h2>Resumen documental por empresa</h2><div class="note">Una ✓ aparece automáticamente cuando todos los documentos requeridos de la etapa están cargados.</div></div></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Empresa</th>${STAGES.filter(s=>s.docs).map(s=>`<th>${s.name.split(' · ')[0]}</th>`).join('')}<th>Avance total</th></tr></thead><tbody>${list.map(c=>{const pcts=stageIds.map(s=>stagePct(c.id,s));const total=Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length);return `<tr><td class="company">${c.name}<div class="sub">${c.id} · ${c.chain}</div></td>${stageIds.map(s=>`<td>${stageComplete(c.id,s)?'<span class="stage-ok">✓ Completo</span>':`<span class="stage-no">${stagePct(c.id,s)}%</span>`}</td>`).join('')}<td><span class="pct">${total}%</span><div class="bar"><i style="width:${total}%"></i></div></td></tr>`}).join('')||'<tr><td colspan="12" class="empty">No hay empresas con estos filtros.</td></tr>'}</tbody></table></div></div>`}
function docCell(c,stage,doc,i){const rec=docsMap.get(key(c.id,stage.id,i));if(!rec)return `<td class="doccell"><div class="docstate"><span class="pending">–</span><span>Pendiente</span></div><div class="actions"><button class="btn red small" onclick="chooseFile('${c.id}','${stage.id}',${i})">Cargar</button></div></td>`;return `<td class="doccell"><div class="docstate"><span class="check">✓</span><span>Cargado</span></div><div class="filename" title="${escapeHtml(rec.name)}">${escapeHtml(rec.name)}</div><div class="actions"><button class="btn link small" onclick="openFile('${c.id}','${stage.id}',${i})">Abrir ↗</button><button class="btn out small" onclick="chooseFile('${c.id}','${stage.id}',${i})">Reemplazar</button><button class="btn link small" onclick="removeFile('${c.id}','${stage.id}',${i})">Quitar</button></div></td>`}
function stageView(stage){const list=filteredCompanies(stage.id);return `${kpiBlock(stage.id)}<div class="panel"><div class="headrow"><div><h2>${stage.name}</h2><div class="note">Carga directa por documento. Al seleccionar un archivo, el estado cambia automáticamente a ✓ Cargado.</div></div><span class="badge green">Guardado local en el navegador</span></div><div class="tablewrap"><table class="tbl"><thead><tr><th>Empresa</th>${stage.docs.map(d=>`<th>${d}</th>`).join('')}<th>Bitácoras</th><th>Etapa</th></tr></thead><tbody>${list.map(c=>{const p=stagePct(c.id,stage.id);return `<tr class="${p===100?'complete':''}"><td class="company">${c.name}<div class="sub">${c.id} · ${c.chain}</div></td>${stage.docs.map((d,i)=>docCell(c,stage,d,i)).join('')}${bitCell(c,stage)}<td><span class="pct">${p}%</span><div class="bar"><i style="width:${p}%"></i></div>${p===100?'<div class="stage-ok" style="margin-top:5px">✓ Completa</div>':''}</td></tr>`}).join('')||`<tr><td colspan="${stage.docs.length+3}" class="empty">No hay empresas con estos filtros.</td></tr>`}</tbody></table></div></div>`}
function bitCell(c,stage){const xs=bitacoras.filter(b=>b.company===c.id && b.stage===stage.id).sort((a,b)=>(a.session||0)-(b.session||0));const has=xs.length>0;return `<td class="bitcell"><div class="docstate">${has?'<span class="check">✓</span>':'<span class="pending">•</span>'}<div><div class="bitcount">${xs.length} bitácora${xs.length!==1?'s':''}</div><div class="sub">${has?'Sesiones registradas':'Sin registros aún'}</div></div></div><div class="actions" style="margin-top:7px"><button class="btn out small" onclick="openBitsModal('${c.id}','${stage.id}')">${has?'Ver / gestionar':'Abrir bitácora'}</button></div></td>`}
function bitItem(b){return `<div class="modalbit"><div class="modalbithead"><div><div class="modalbittitle"><span class="bitbadge">Sesión ${b.session||'–'}</span><b>${escapeHtml(b.date||'')}</b></div><div class="bitmeta">${escapeHtml(b.mentor||'Mentor no indicado')}</div></div><div class="badge ${b.mainName?'green':'amber'}">${b.mainName?'Archivo principal cargado':'Pendiente archivo'}</div></div>${b.advances?`<div class="bittext"><b>Avances:</b> ${escapeHtml(b.advances)}</div>`:''}${b.next?`<div class="bittext"><b>Próximos pasos:</b> ${escapeHtml(b.next)}</div>`:''}<div class="actions">${b.mainName?`<button class="btn link small" onclick="openBitFile('${b.id}','main')">Abrir bitácora ↗</button>`:''}${b.extraName?`<button class="btn link small" onclick="openBitFile('${b.id}','extra')">Abrir adjunto ↗</button>`:''}<button class="btn link small" onclick="removeBit('${b.id}')">Quitar</button></div></div>`}
function openBitsModal(company,stage){const c=companies.find(x=>x.id===company);const st=STAGES.find(x=>x.id===stage);const xs=bitacoras.filter(b=>b.company===company && b.stage===stage).sort((a,b)=>(a.session||0)-(b.session||0));document.getElementById('modal').innerHTML=`<div class="modalbox bitsbox"><div class="bitshead"><div><h3>Bitácoras · ${escapeHtml(c?.name||company)}</h3><div class="bitsstage">${escapeHtml(st?.name||stage)}</div></div><div><button class="btn red small" onclick="newBit('${company}','${stage}')">+ Registrar bitácora</button></div></div><div class="bitscontent">${xs.length?xs.map(b=>bitItem(b)).join(''):`<div class="modalempty">Aún no hay bitácoras registradas para esta etapa.<br>Puedes crear la primera desde este pop-up.</div>`}</div><div class="modalactions"><button class="btn out" onclick="closeModal()">Cerrar</button></div></div>`;document.getElementById('modal').classList.add('show')}
let pendingBit={};
function newBit(company,stage){pendingBit={company,stage};const c=companies.find(x=>x.id===company);const st=STAGES.find(x=>x.id===stage);document.getElementById('modal').innerHTML=`<div class="modalbox"><h3>Nueva bitácora · ${escapeHtml(c?.name||company)}</h3><div class="note" style="margin-bottom:10px">${escapeHtml(st?.name||stage)}</div><div class="modalgrid"><div><label>N.° de sesión</label><input id="bitSession" type="number" min="1" value="${nextSession(company)}"></div><div><label>Fecha de sesión</label><input id="bitDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div><div class="full"><label>Mentor / responsable</label><input id="bitMentor" placeholder="Nombre del mentor"></div><div class="full"><label>Avances</label><textarea id="bitAdv" placeholder="Avances relevantes de la sesión"></textarea></div><div class="full"><label>Próximos pasos</label><textarea id="bitNext" placeholder="Acuerdos y próximos pasos"></textarea></div><div class="full"><label>Archivo principal de bitácora</label><input id="bitMain" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png"></div><div class="full"><label>Archivo adicional (opcional)</label><input id="bitExtra" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png"></div></div><div class="modalactions"><button class="btn out" onclick="openBitsModal('${company}','${stage}')">Volver</button><button class="btn red" onclick="saveBit()">Guardar bitácora</button></div></div>`;document.getElementById('modal').classList.add('show')}
async function saveBit(){const main=document.getElementById('bitMain').files[0];const extra=document.getElementById('bitExtra').files[0];if(!main){showToast('Carga el archivo principal de la bitácora.');return}if(main.size>20*1024*1024 || (extra&&extra.size>20*1024*1024)){showToast('Un archivo supera 20 MB en este demo.');return}const rec={id:`BIT-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,company:pendingBit.company,stage:pendingBit.stage,session:Number(document.getElementById('bitSession').value)||nextSession(pendingBit.company),date:document.getElementById('bitDate').value,mentor:document.getElementById('bitMentor').value.trim(),advances:document.getElementById('bitAdv').value.trim(),next:document.getElementById('bitNext').value.trim(),mainName:main.name,mainType:main.type,mainBlob:main,extraName:extra?extra.name:'',extraType:extra?extra.type:'',extraBlob:extra||null,updated:new Date().toISOString()};await putBit(rec);await refreshDocs();render();openBitsModal(pendingBit.company,pendingBit.stage);showToast('Bitácora registrada.');}
async function openBitFile(id,which){const rec=await getBit(id);if(!rec)return;const blob=which==='extra'?rec.extraBlob:rec.mainBlob;if(!blob){showToast('No se encontró el archivo.');return}const url=URL.createObjectURL(blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function removeBit(id){const rec=await getBit(id);if(!confirm('¿Quitar esta bitácora del demo?'))return;await delBit(id);await refreshDocs();render();if(rec)openBitsModal(rec.company,rec.stage);showToast('Bitácora retirada.');}

function render(){renderTabs();const st=STAGES.find(s=>s.id===current);document.getElementById('content').innerHTML=current==='overview'?overview():stageView(st)}
function setTab(id){current=id;render();window.scrollTo({top:120,behavior:'smooth'})}
function chooseFile(company,stage,doc){const inp=document.createElement('input');inp.type='file';inp.accept='.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.jpg,.jpeg,.png';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;if(f.size>20*1024*1024){showToast('Archivo supera 20 MB en este demo.');return}await putDoc({key:key(company,stage,doc),company,stage,doc,name:f.name,type:f.type,size:f.size,updated:new Date().toISOString(),blob:f});await refreshDocs();render();showToast('Documento cargado y cumplimiento actualizado.');};inp.click()}
async function openFile(company,stage,doc){const rec=await getDoc(key(company,stage,doc));if(!rec){showToast('No se encontró el archivo.');return}const url=URL.createObjectURL(rec.blob);window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
async function removeFile(company,stage,doc){if(!confirm('¿Quitar este documento del demo?'))return;await delDoc(key(company,stage,doc));await refreshDocs();render();showToast('Documento retirado.');}
async function clearDemo(){if(!confirm('Esto eliminará todos los archivos y bitácoras cargados localmente. ¿Continuar?'))return;await clearDB();await clearBits();await refreshDocs();render();showToast('Datos eliminados.');}
function escapeHtml(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function closeModal(){document.getElementById('modal').classList.remove('show')}

['q','chain','state'].forEach(id=>document.getElementById(id).addEventListener('change',render));
(async()=>{await openDB();await refreshDocs();render();})();
</script>
</body>
</html>
