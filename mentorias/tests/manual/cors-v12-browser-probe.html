<!doctype html><html lang="es"><meta charset="utf-8"><title>Sonda CORS V1.2</title><body>
<h1>Sonda CORS V1.2</h1><p>Ejecutar únicamente desde https://eanfoundershub.github.io/swisscontact/mentorias/. No guarda ni muestra credenciales.</p>
<label>Endpoint TEST <input id="endpoint" type="url" size="90"></label><br><label>Token V1.2 <input id="token" type="password" autocomplete="off"></label><br><label>Bearer OAuth opcional <input id="bearer" type="password" autocomplete="off"></label><br>
<button id="options">OPTIONS</button><button id="post">POST</button><pre id="result"></pre>
<script>
const out=document.querySelector('#result');async function probe(method){const endpoint=document.querySelector('#endpoint').value,token=document.querySelector('#token').value,bearer=document.querySelector('#bearer').value;const headers={'Content-Type':'application/json'};if(bearer)headers.Authorization=`Bearer ${bearer}`;try{const r=await fetch(endpoint,{method,headers,body:method==='POST'?JSON.stringify({operation:'consultarEmpresasDisponibles',accessToken:token}):undefined,mode:'cors',cache:'no-store',credentials:'omit'});out.textContent=JSON.stringify({status:r.status,type:r.type,contentType:r.headers.get('content-type'),allowOrigin:r.headers.get('access-control-allow-origin'),allowMethods:r.headers.get('access-control-allow-methods'),allowHeaders:r.headers.get('access-control-allow-headers')},null,2)}catch(e){out.textContent=JSON.stringify({error:e.name,message:e.message},null,2)}}document.querySelector('#options').onclick=()=>probe('OPTIONS');document.querySelector('#post').onclick=()=>probe('POST');
</script></body></html>
